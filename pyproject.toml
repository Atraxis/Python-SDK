[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atraxis-sdk"
version = "0.1.1"
description = "Official Python SDK and local MCP server for the Atraxis public API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Atraxis" }]
keywords = ["atraxis", "api", "sdk", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
dev = [
  "build>=1.3,<2",
  "hatchling>=1.27,<2",
  "mcp>=2.2,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "PyYAML>=6,<7",
  "ruff>=0.11,<1",
]

[project.urls]
Documentation = "https://atraxisonline.com/developers/api"
Repository = "https://github.com/Atraxis/Python-SDK"
Issues = "https://github.com/Atraxis/Python-SDK/issues"

[project.scripts]
atraxis-mcp = "atraxis.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atraxis"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.hatch.build]
artifacts = ["src/atraxis/_contract/*.json", "src/atraxis/_contract/*.sha256"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["atraxis"]
